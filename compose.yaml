# Root deployment: OctoPrint is the sole MKS WiFi raw TCP (8080) client.
# Observatory communicates with OctoPrint over the private Compose network.
# Requires Docker Compose v2.20+ with include support.
# Configure a private .env at the repository root; see .env.example.
include:
  - path: ./integrations/octoprint/compose.yaml
  - path: ./integrations/mks-wifi/compose.yaml
