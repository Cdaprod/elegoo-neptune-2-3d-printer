name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/mks-wifi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: integrations/mks-wifi/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra web --no-editable
      - name: Run Python tests
        run: uv run --no-sync pytest -q
      - name: Verify manufacturing cache permissions in the production image
        run: |
          docker build -t neptune-observatory-manufacturing-ci .
          docker run --rm --network none --mount type=volume,dst=/data/manufacturing --entrypoint python neptune-observatory-manufacturing-ci -c "import os; from pathlib import Path; from mks_wifi_bridge.manufacturing.controller import Controller; assert os.getuid() != 0; c=Controller(Path('/data/manufacturing'),Path('/data/manufacturing/projects')); assert c.discover() == []; print('Non-root manufacturing registry initialized on fresh Docker volume')"
      - name: Validate flag-free SD rebuild and failure recovery
        run: |
          python ../../scripts/test_neptune_sd_rebuild.py -q
          python ../../scripts/test_appliance_config.py -q
      - name: Lint and formatting
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check --diff src tests
      - name: Compile dashboard JavaScript
        run: node ../../scripts/check_dashboard_js.cjs
      - name: Run frontend logic tests
        run: node --test tests/*.mjs
      - name: Validate Compose configuration
        env:
          MKS_WIFI_HOST: printer.example.invalid
          NEPTUNE_OBSERVATORY_TOKEN: validation-only-not-a-secret
        run: docker compose config --quiet
      - name: Validate root included stack and exclusive printer ownership
        working-directory: .
        env:
          NEPTUNE_OBSERVATORY_TOKEN: validation-only-not-a-secret
          OCTOPRINT_API_KEY: validation-only-not-a-secret
          OCTOPRINT_MKS_WIFI_HOST: printer.example.invalid
          OCTOPRINT_MKS_WIFI_PORT: "8080"
        run: |
          docker compose config --quiet
          docker compose config --format json > /tmp/neptune-root-compose.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/neptune-root-compose.json", encoding="utf-8"))
          services = data["services"]
          assert set(services) == {"octoprint", "neptune-observatory"}, set(services)
          observer = services["neptune-observatory"]
          env = observer["environment"]
          assert env["NEPTUNE_PRINTER_BACKEND"] == "octoprint"
          assert env["OCTOPRINT_BASE_URL"] == "http://octoprint:80"
          assert env["NEPTUNE_CONTROL_EXECUTION_ENABLED"] == "false"
          assert env["OCTOPRINT_API_KEY"] == "validation-only-not-a-secret"
          assert "octoprint" in observer["depends_on"]
          assert env["NEPTUNE_GCODE_SOURCE_DIR"] == "/mnt/octoprint/octoprint/uploads"
          upload_mount = next(v for v in observer["volumes"] if v["target"] == "/mnt/octoprint")
          assert upload_mount["read_only"] is True
          assert upload_mount["source"] == services["octoprint"]["volumes"][0]["source"]
          printer = services["octoprint"]["environment"]
          assert printer["OCTOPRINT_MKS_WIFI_HOST"] == "printer.example.invalid"
          assert str(printer["OCTOPRINT_MKS_WIFI_PORT"]) == "8080"
          assert printer["OCTOPRINT_MKS_AUTO_CONNECT"] == "false"
          assert observer["networks"] == services["octoprint"]["networks"]
          print("Root stack: OctoPrint is sole MKS WiFi client, Observatory uses OctoPrint API")
          PY

  dashboard-browser:
    # Playwright's pinned Chromium build supports Ubuntu 24.04, not runner 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Observatory and Chromium
        run: |
          cd integrations/mks-wifi
          uv sync --locked --extra web --no-editable
          cd ../..
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start isolated dashboard without a physical printer
        working-directory: integrations/mks-wifi
        env:
          MKS_WIFI_HOST: printer.example.invalid
          NEPTUNE_CONTROL_EXECUTION_ENABLED: "false"
          NEPTUNE_OCTOPRINT_CONTROLS_ENABLED: "false"
          NEPTUNE_GCODE_SOURCE_DIR: /tmp/neptune-hmi-browser
          NEPTUNE_HMI_PREVIEW_CACHE_DIR: /tmp/neptune-hmi-preview-cache
          NEPTUNE_TIMELINE_DB_PATH: /tmp/neptune-hmi-browser.sqlite
        run: |
          python ../../scripts/hmi_browser_fixture.py
          .venv/bin/neptune-observatory --host 127.0.0.1 --port 8000 > /tmp/observatory-browser.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/observatory-browser.log
          exit 1
      - name: Verify every dashboard sidebar view in Chromium
        run: node scripts/test-dashboard-navigation.cjs
      - name: Verify Waveshare 3D HMI at 1280 by 400
        env:
          HMI_SCREENSHOT: /tmp/neptune-hmi-models-1280x400.png
          HMI_SCREENSHOT_DIR: /tmp/neptune-appliance-screenshots
          SCULPTURE_SCREENSHOT_DIR: /tmp/neptune-sculpture-previews
        run: |
          node scripts/test-hmi-navigation.cjs
          node scripts/test-hmi-3d-gallery.cjs
          node scripts/test-appliance-hmi.cjs
          node scripts/test-hmi-cinematic.cjs
          node scripts/test-sculpture-browser.cjs
          node scripts/test-hmi-operator.cjs
      - name: Upload HMI geometry gallery screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neptune-hmi-3d-gallery-1280x400
          path: |
            /tmp/neptune-hmi-models-1280x400.png
            /tmp/neptune-appliance-screenshots/*.png
            /tmp/neptune-sculpture-previews/*.png
          if-no-files-found: ignore


  octoprint-plugin-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build OctoPrint image with offline plugin wheelhouse
        run: docker build -t neptune-octoprint-ci integrations/octoprint
      - name: Check bundled plugin wheel and startup installer
        run: |
          docker run --rm --entrypoint /bin/sh neptune-octoprint-ci -c '
            set -eu
            ls /opt/octoprint-plugin-wheels | grep -qi print_job_history
            test -x /etc/cont-init.d/90-install-octoprint-plugins
            /etc/cont-init.d/90-install-octoprint-plugins
          '
      - name: Verify raw TCP configuration bootstrapping preserves user settings
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e OCTOPRINT_CONFIG_DIR=/tmp/neptune-rawtcp-ci \
            -e OCTOPRINT_MKS_WIFI_HOST=printer.example.invalid \
            -e OCTOPRINT_MKS_WIFI_PORT=8080 neptune-octoprint-ci -c '
              set -eu
              test -x /etc/cont-init.d/91-configure-mks-remote
              /etc/cont-init.d/91-configure-mks-remote
              /etc/cont-init.d/91-configure-mks-remote
              /usr/local/bin/python3 -c '"'"'import yaml; d=yaml.safe_load(open("/tmp/neptune-rawtcp-ci/config.yaml")); assert d["plugins"]["remote_connection"]["remotes"] == [{"host":"printer.example.invalid","port":8080,"protocol":"socket"}]; assert d["serial"]["port"] == "REMOTE:socket://printer.example.invalid:8080"; assert not d["serial"].get("autoconnect",False)'"'"'
              printf "plugins:\\n  unrelated:\\n    option: keep\\nserial:\\n  port: /dev/ttyUSB0\\n" > /tmp/neptune-rawtcp-ci/config.yaml
              /etc/cont-init.d/91-configure-mks-remote
              /usr/local/bin/python3 -c '"'"'import yaml; d=yaml.safe_load(open("/tmp/neptune-rawtcp-ci/config.yaml")); assert d["plugins"]["unrelated"]["option"] == "keep"; assert d["serial"]["port"] == "/dev/ttyUSB0"; assert len(d["plugins"]["remote_connection"]["remotes"]) == 1'"'"'
            '

  observatory-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native ARM64 appliance backend
        run: docker build -t neptune-observatory-arm64 integrations/mks-wifi
      - name: Validate ARM64 imports and persistent registry without a printer
        run: |
          docker run --rm --network none --mount type=volume,dst=/data/manufacturing --entrypoint python neptune-observatory-arm64 -c "import platform; from pathlib import Path; from mks_wifi_bridge.observatory import create_app; from mks_wifi_bridge.gcode_fabrication import FabricationPreviewService; from mks_wifi_bridge.manufacturing.controller import Controller; assert platform.machine() == 'aarch64'; Controller(Path('/data/manufacturing'),Path('/data/manufacturing/projects')); print('ARM64 application imports and non-root registry passed')"
