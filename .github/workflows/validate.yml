name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/mks-wifi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: integrations/mks-wifi/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra web --no-editable
      - name: Run Python tests
        run: uv run --no-sync pytest -q
      - name: Lint and formatting
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
      - name: Run frontend logic tests
        run: node --test tests/*.mjs
      - name: Validate Compose configuration
        env:
          MKS_WIFI_HOST: printer.example.invalid
          NEPTUNE_OBSERVATORY_TOKEN: validation-only-not-a-secret
        run: docker compose config --quiet
      - name: Validate root included stack and exclusive printer ownership
        working-directory: .
        env:
          NEPTUNE_OBSERVATORY_TOKEN: validation-only-not-a-secret
          OCTOPRINT_API_KEY: validation-only-not-a-secret
          OCTOPRINT_MKS_WIFI_HOST: printer.example.invalid
          OCTOPRINT_MKS_WIFI_PORT: "8080"
        run: |
          docker compose config --quiet
          docker compose config --format json > /tmp/neptune-root-compose.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/neptune-root-compose.json", encoding="utf-8"))
          services = data["services"]
          assert set(services) == {"octoprint", "neptune-observatory"}, set(services)
          observer = services["neptune-observatory"]
          env = observer["environment"]
          assert env["NEPTUNE_PRINTER_BACKEND"] == "octoprint"
          assert env["OCTOPRINT_BASE_URL"] == "http://octoprint:80"
          assert env["NEPTUNE_CONTROL_EXECUTION_ENABLED"] == "false"
          assert env["OCTOPRINT_API_KEY"] == "validation-only-not-a-secret"
          assert "octoprint" in observer["depends_on"]
          printer = services["octoprint"]["environment"]
          assert printer["OCTOPRINT_MKS_WIFI_HOST"] == "printer.example.invalid"
          assert str(printer["OCTOPRINT_MKS_WIFI_PORT"]) == "8080"
          assert printer["OCTOPRINT_MKS_AUTO_CONNECT"] == "false"
          assert observer["networks"] == services["octoprint"]["networks"]
          print("Root stack: OctoPrint is sole MKS WiFi client, Observatory uses OctoPrint API")
          PY

  octoprint-plugin-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build OctoPrint image with offline plugin wheelhouse
        run: docker build -t neptune-octoprint-ci integrations/octoprint
      - name: Check bundled plugin wheel and startup installer
        run: |
          docker run --rm --entrypoint /bin/sh neptune-octoprint-ci -c '
            set -eu
            ls /opt/octoprint-plugin-wheels | grep -qi print_job_history
            test -x /etc/cont-init.d/90-install-octoprint-plugins
            /etc/cont-init.d/90-install-octoprint-plugins
          '
      - name: Verify raw TCP configuration bootstrapping preserves user settings
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e OCTOPRINT_CONFIG_DIR=/tmp/neptune-rawtcp-ci \
            -e OCTOPRINT_MKS_WIFI_HOST=printer.example.invalid \
            -e OCTOPRINT_MKS_WIFI_PORT=8080 neptune-octoprint-ci -c '
              set -eu
              test -x /etc/cont-init.d/91-configure-mks-remote
              /etc/cont-init.d/91-configure-mks-remote
              /etc/cont-init.d/91-configure-mks-remote
              /usr/local/bin/python3 -c '"'"'import yaml; d=yaml.safe_load(open("/tmp/neptune-rawtcp-ci/config.yaml")); assert d["plugins"]["remote_connection"]["remotes"] == [{"host":"printer.example.invalid","port":8080,"protocol":"socket"}]; assert d["serial"]["port"] == "REMOTE:socket://printer.example.invalid:8080"; assert not d["serial"].get("autoconnect",False)'"'"'
              printf "plugins:\\n  unrelated:\\n    option: keep\\nserial:\\n  port: /dev/ttyUSB0\\n" > /tmp/neptune-rawtcp-ci/config.yaml
              /etc/cont-init.d/91-configure-mks-remote
              /usr/local/bin/python3 -c '"'"'import yaml; d=yaml.safe_load(open("/tmp/neptune-rawtcp-ci/config.yaml")); assert d["plugins"]["unrelated"]["option"] == "keep"; assert d["serial"]["port"] == "/dev/ttyUSB0"; assert len(d["plugins"]["remote_connection"]["remotes"]) == 1'"'"'
            '
