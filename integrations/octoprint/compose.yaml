services:
  octoprint:
    profiles: ["octoprint"]
    build:
      context: .
      dockerfile: Dockerfile
    image: cdaprod/neptune-octoprint:local
    container_name: neptune-octoprint
    restart: unless-stopped
    ports:
      - "${OCTOPRINT_BIND_ADDRESS:-0.0.0.0}:${OCTOPRINT_HOST_PORT:-5001}:80"
    volumes:
      - octoprint-data:/octoprint
    environment:
      ENABLE_MJPG_STREAMER: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  octoprint-data:
