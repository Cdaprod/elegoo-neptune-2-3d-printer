services:
  octoprint:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdaprod/neptune-octoprint:local
    container_name: neptune-octoprint
    restart: unless-stopped
    ports:
      - "${OCTOPRINT_BIND_ADDRESS:-0.0.0.0}:${OCTOPRINT_HOST_PORT:-5001}:80"
    volumes:
      - octoprint-data:/octoprint
    environment:
      ENABLE_MJPG_STREAMER: "false"
      OCTOPRINT_MKS_WIFI_HOST: ${OCTOPRINT_MKS_WIFI_HOST:?Set OCTOPRINT_MKS_WIFI_HOST to your printer IP or hostname}
      OCTOPRINT_MKS_WIFI_PORT: ${OCTOPRINT_MKS_WIFI_PORT:-8080}
      OCTOPRINT_MKS_AUTO_CONNECT: ${OCTOPRINT_MKS_AUTO_CONNECT:-false}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  octoprint-data:
